<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - sistemaErick</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            display: flex;
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            min-height: 480px;
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #eef2f7 0%, #e0e8f5 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #1565c0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #0d47a1;
        }

        .welcome-content h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .info-box {
            border-left: 4px solid #1976d2;
            padding-left: 14px;
        }

        .info-box p {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }

        .right-panel {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-panel h2 {
            font-size: 24px;
            color: #1565c0;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #1976d2;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4b5563;
            cursor: pointer;
        }

        .forgot-password {
            color: #1565c0;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #1565c0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0d47a1;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            font-size: 12px;
            color: #1565c0;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .card {
                flex-direction: column;
            }
            .left-panel {
                padding: 30px;
            }
            .right-panel {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="left-panel">
            <div class="brand-logo">sistema<span>Erick</span></div>
            <div class="welcome-content">
                <h1>Bem-vindo!</h1>
                <div class="info-box">
                    <p>Tenha acesso às suas informações de forma rápida, segura e organizada.</p>
                </div>
            </div>
            <div></div>
        </div>

        <div class="right-panel">
            <h2>Entrar na sua conta</h2>
            <p class="subtitle">Informe seus dados para acessar o sistema</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>

                <div class="register-link">
                    <a href="#">Ainda não possui uma conta?</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
